<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeus-X · Admin Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: radial-gradient(ellipse at top, #1a0f2e 0%, #0a0612 60%); color: #ebe1fa; min-height: 100vh; padding: 24px; }
  .container { max-width: 1300px; margin: 0 auto; }
  h1 { font-size: 28px; background: linear-gradient(135deg, #8c5aff 0%, #dc96ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px; letter-spacing: 2px; }
  
  .login-box { background: rgba(26, 15, 46, 0.6); border: 1px solid #6b46c2; border-radius: 16px; padding: 32px; max-width: 420px; margin: 80px auto; text-align: center; backdrop-filter: blur(20px); }
  .login-box input { width: 100%; padding: 14px; background: #0a0612; border: 1px solid #6b46c2; border-radius: 10px; color: #ebe1fa; font-size: 15px; margin-bottom: 14px; }
  
  .btn { background: linear-gradient(135deg, #6b3fc2, #b482ff); color: white; border: none; padding: 14px 32px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; letter-spacing: 1px; transition: transform 0.2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn.red { background: linear-gradient(135deg, #8a2030, #d84060); }
  .btn.green { background: linear-gradient(135deg, #2a8f5a, #4ecca0); }
  .btn.blue { background: linear-gradient(135deg, #2a5f8f, #4ea8cc); }
  .btn.gold { background: linear-gradient(135deg, #8a6a20, #d4a040); }
  .btn.small { padding: 8px 16px; font-size: 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: rgba(26, 15, 46, 0.6); border: 1px solid #6b46c2; border-radius: 12px; padding: 16px; }
  .stat .label { color: #a195c1; font-size: 11px; margin-bottom: 6px; letter-spacing: 1px; }
  .stat .value { font-size: 22px; font-weight: 800; color: #b482ff; }
  .stat.green .value { color: #4ecca0; }

  .quick-panel { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid rgba(107, 70, 194, 0.3); padding-bottom: 8px; flex-wrap: wrap; }
  .tab { padding: 10px 20px; background: rgba(38, 22, 62, 0.4); border: 1px solid rgba(107, 70, 194, 0.3); border-radius: 10px; color: #a195c1; cursor: pointer; font-weight: 700; font-size: 13px; letter-spacing: 1px; transition: all 0.3s; }
  .tab:hover { color: #ebe1fa; border-color: #b482ff; }
  .tab.active { background: linear-gradient(135deg, #6b3fc2, #b482ff); color: white; border-color: #b482ff; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .search-row input { flex: 1; min-width: 220px; padding: 12px 16px; background: rgba(10, 6, 18, 0.6); border: 1px solid #6b46c2; border-radius: 10px; color: #ebe1fa; font-size: 14px; outline: none; }

  .bulk-bar { display: flex; gap: 10px; margin-bottom: 12px; padding: 12px 16px; background: rgba(140, 90, 255, 0.1); border: 1px solid rgba(140, 90, 255, 0.3); border-radius: 10px; align-items: center; flex-wrap: wrap; }
  .bulk-bar .count { font-weight: 700; color: #dc96ff; margin-right: auto; }

  .table-wrap { max-height: 600px; overflow-y: auto; border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; background: rgba(26, 15, 46, 0.6); border-radius: 12px; overflow: hidden; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(107, 70, 194, 0.3); font-size: 12px; }
  th { background: rgba(38, 22, 62, 0.8); color: #b482ff; font-weight: 700; position: sticky; top: 0; z-index: 2; }
  tr:hover { background: rgba(140, 90, 255, 0.08); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .dot.green { background: #4ecca0; box-shadow: 0 0 8px #4ecca0; }
  .dot.red { background: #ff6b8a; box-shadow: 0 0 8px #ff6b8a; }
  .dot.grey { background: #666; }
  .actions { display: flex; gap: 6px; }
  .actions button { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 700; color: white; }
  .mono { font-family: 'Courier New', monospace; font-size: 11px; }
  #panel { display: none; }
  .error { color: #ff6b8a; margin-top: 12px; font-size: 13px; }
</style>
</head><body>
<div class="container">
  <div class="login-box" id="loginBox">
    <h1>ZEUS-X</h1>
    <p style="color: #a195c1; margin-bottom: 20px;">admin panel · login required</p>
    <input type="text" id="loginInput" placeholder="логин" autocomplete="off" />
    <input type="password" id="pwdInput" placeholder="пароль" />
    <button class="btn" onclick="doLogin()">войти</button>
    <p class="error" id="loginError"></p>
  </div>

  <div id="panel">
    <h1>ZEUS-X · Admin</h1>
    <div style="text-align: right; margin-bottom: 12px;">
      <button class="btn small" onclick="logout()">выход</button>
      <button class="btn small blue" onclick="exportCsv()">📥 CSV</button>
    </div>

    <!-- Быстрая выдача -->
    <div class="quick-panel">
        <button class="btn green" onclick="quickGenKey()">⚡ Выдать ключ (7 дней)</button>
        <button class="btn green" onclick="quickGenKey(1)">⚡ Выдать ключ (1 день)</button>
        <button class="btn green" onclick="quickGenKey(30)">⚡ Выдать ключ (30 дней)</button>
    </div>

    <div class="stats" id="statsBox"></div>

    <div class="tabs">
      <div class="tab active" data-tab="keys" onclick="switchTab('keys')">🔑 Ключи</div>
      <div class="tab" data-tab="activations" onclick="switchTab('activations')">📜 Активации</div>
      <div class="tab" data-tab="stats" onclick="switchTab('stats')">📈 Статистика</div>
    </div>

    <div class="tab-panel active" id="tab-keys">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="поиск: ключ / ник / HWID / IP" autocomplete="off" />
        <button class="btn small" onclick="doSearch()">найти</button>
        <button class="btn small blue" onclick="clearSearch()">сброс</button>
      </div>

      <div class="bulk-bar" id="bulkBar" style="display: none;">
        <span class="count" id="bulkCount">0 выбрано</span>
        <button class="btn small red" onclick="bulkBan()">бан</button>
        <button class="btn small green" onclick="bulkUnban()">разбан</button>
        <button class="btn small gold" onclick="bulkExtend(7)">+7 дней</button>
        <button class="btn small gold" onclick="bulkExtend(30)">+30 дней</button>
        <button class="btn small" onclick="clearSelection()">снять</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 30px;"><input type="checkbox" id="checkAll" onchange="toggleAll(this)"></th>
              <th>Ключ</th>
              <th>Статус</th>
              <th>Вер.</th>
              <th>IP</th>
              <th>Юзер</th>
              <th>Дней</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="keysBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="tab-activations">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Ключ</th><th>HWID</th><th>IP</th><th>Юзер</th><th>Вер.</th><th>Дата</th></tr></thead>
          <tbody id="activationsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="tab-stats">
      <div class="stats" id="statsFullBox" style="margin-bottom: 24px;"></div>
    </div>
  </div>
</div><script>
  const SERVER = 'https://zeus-key-mjep.onrender.com';
  let login = ''; let pwd = ''; let currentKeys = []; let selectedKeys = new Set(); let currentTab = 'keys';

  function authQS() { return 'login=' + encodeURIComponent(login) + '&pwd=' + encodeURIComponent(pwd); }

  function doLogin() {
    login = document.getElementById('loginInput').value.trim();
    pwd = document.getElementById('pwdInput').value;
    fetch(SERVER + '/admin/login?' + authQS()).then(r => r.json()).then(data => {
        if (data.ok) { sessionStorage.setItem('z_login', login); sessionStorage.setItem('z_pwd', pwd); showPanel(); }
        else { document.getElementById('loginError').textContent = data.reason === 'wrong_credentials' ? 'неверный логин/пароль' : 'ошибка'; }
      }).catch(() => { document.getElementById('loginError').textContent = 'сервер не отвечает'; });
  }

  function logout() {
    sessionStorage.removeItem('z_login'); sessionStorage.removeItem('z_pwd');
    login = ''; pwd = ''; document.getElementById('panel').style.display = 'none'; document.getElementById('loginBox').style.display = 'block';
  }

  function showPanel() {
    document.getElementById('loginBox').style.display = 'none'; document.getElementById('panel').style.display = 'block';
    loadKeys(); loadStats();
  }

  function switchTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    if (name === 'activations') loadActivations();
    if (name === 'stats') loadStats();
  }

  function loadKeys() {
    fetch(SERVER + '/admin/keys?' + authQS()).then(r => r.json()).then(data => {
        if (!data.ok) { if (data.reason === 'too_many_attempts' || data.reason === 'wrong_credentials') logout(); return; }
        document.getElementById('statsBox').innerHTML = `
            <div class="stat"><div class="label">АКТИВАЦИЙ</div><div class="value">${data.activations_left}</div></div>
            <div class="stat"><div class="label">ВСЕГО КЛЮЧЕЙ</div><div class="value">${data.total_keys}</div></div>
        `;
        currentKeys = data.keys; renderKeys(currentKeys);
      });
  }

  function renderKeys(keys) {
    const tbody = document.getElementById('keysBody'); tbody.innerHTML = '';
    keys.forEach(k => {
        const tr = document.createElement('tr');
        let statusText = k.banned ? 'забанен' : (k.expired ? 'истёк' : (k.used ? 'активен' : 'свободен'));
        const checked = selectedKeys.has(k.key) ? 'checked' : '';
        tr.innerHTML = `
            <td><input type="checkbox" ${checked} onchange="toggleKey('${k.key}', this.checked)"></td>
            <td class="mono">${k.key} <button class="btn small blue" style="padding: 2px 6px; font-size: 10px;" onclick="copyKey('${k.key}')">copy</button></td>
            <td><span class="dot ${k.status}"></span>${statusText}</td>
            <td>${k.version || '—'}</td>
            <td class="mono">${k.ip || '—'}</td>
            <td>${k.username || '—'}</td>
            <td>${k.days_left}</td>
            <td class="actions">
              ${k.banned ? `<button class="green" onclick="unban('${k.key}')">разбан</button>` : `<button class="red" onclick="ban('${k.key}')">бан</button>`}
              ${k.hwid ? `<button class="blue" onclick="resetHwid('${k.key}')">📱</button>` : ''}
            </td>
        `;
        tbody.appendChild(tr);
    });
    updateBulkBar();
  }

  function copyKey(key) {
    navigator.clipboard.writeText(key).then(() => alert('Ключ скопирован!'));
  }

  function quickGenKey(days) {
    days = days || 7;
    fetch(SERVER + '/admin/generate_one?days=' + days + '&' + authQS())
        .then(r => r.json())
        .then(data => {
            if (data.ok) { navigator.clipboard.writeText(data.key); alert('Ключ ' + data.key + ' на ' + days + ' дн. создан и скопирован!'); loadKeys(); }
            else alert('Ошибка: ' + data.reason);
        });
  }

  function toggleKey(key, checked) { if (checked) selectedKeys.add(key); else selectedKeys.delete(key); updateBulkBar(); }
  function toggleAll(cb) { selectedKeys.clear(); if (cb.checked) currentKeys.forEach(k => selectedKeys.add(k.key)); renderKeys(currentKeys); }
  function clearSelection() { selectedKeys.clear(); document.getElementById('checkAll').checked = false; renderKeys(currentKeys); }
  function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    if (selectedKeys.size === 0) bar.style.display = 'none';
    else { bar.style.display = 'flex'; document.getElementById('bulkCount').textContent = selectedKeys.size + ' выбрано'; }
  }
</script><script>
  function bulkBan() { if (!selectedKeys.size) return; fetch(SERVER + '/admin/ban_bulk?keys=' + encodeURIComponent(Array.from(selectedKeys).join(',')) + '&' + authQS()).then(() => { clearSelection(); loadKeys(); }); }
  function bulkUnban() { if (!selectedKeys.size) return; fetch(SERVER + '/admin/unban_bulk?keys=' + encodeURIComponent(Array.from(selectedKeys).join(',')) + '&' + authQS()).then(() => { clearSelection(); loadKeys(); }); }
  function bulkExtend(days) { if (!selectedKeys.size) return; fetch(SERVER + '/admin/extend_bulk?keys=' + encodeURIComponent(Array.from(selectedKeys).join(',')) + '&days=' + days + '&' + authQS()).then(() => { clearSelection(); loadKeys(); }); }
  
  function ban(key) { fetch(SERVER + '/admin/ban?key=' + encodeURIComponent(key) + '&' + authQS()).then(() => loadKeys()); }
  function unban(key) { fetch(SERVER + '/admin/unban?key=' + encodeURIComponent(key) + '&' + authQS()).then(() => loadKeys()); }
  function resetHwid(key) { if (!confirm('Сбросить HWID?')) return; fetch(SERVER + '/admin/reset_hwid?key=' + encodeURIComponent(key) + '&' + authQS()).then(() => loadKeys()); }

  function doSearch() {
    const q = document.getElementById('searchInput').value.trim(); if (!q) return clearSearch();
    fetch(SERVER + '/admin/find_key?q=' + encodeURIComponent(q) + '&' + authQS()).then(r => r.json()).then(data => { if (data.ok) { currentKeys = data.results; renderKeys(currentKeys); } });
  }
  function clearSearch() { document.getElementById('searchInput').value = ''; loadKeys(); }

  function loadActivations() {
    fetch(SERVER + '/admin/activations?' + authQS()).then(r => r.json()).then(data => {
        if (!data.ok) return; const tbody = document.getElementById('activationsBody'); tbody.innerHTML = '';
        data.activations.forEach(a => {
            const tr = document.createElement('tr'); const date = a.activated_at ? new Date(a.activated_at * 1000).toLocaleString('ru-RU') : '—';
            tr.innerHTML = `<td class="mono">${a.key}</td><td class="mono">${(a.hwid || '').slice(0, 16)}...</td><td class="mono">${a.ip || '—'}</td><td>${a.username || '—'}</td><td>${a.version || '—'}</td><td>${date}</td>`;
            tbody.appendChild(tr);
        });
      });
  }

  function loadStats() {
    fetch(SERVER + '/admin/stats?' + authQS()).then(r => r.json()).then(data => {
        if (!data.ok) return;
        document.getElementById('statsFullBox').innerHTML = `
            <div class="stat"><div class="label">АКТИВАЦИЙ</div><div class="value">${data.activations_left}</div></div>
            <div class="stat"><div class="label">ВСЕГО</div><div class="value">${data.total_keys}</div></div>
            <div class="stat green"><div class="label">АКТИВНЫХ</div><div class="value">${data.active_keys}</div></div>
            <div class="stat"><div class="label">ЗАБАНЕНО</div><div class="value">${data.banned_keys}</div></div>
            <div class="stat"><div class="label">СЕГОДНЯ</div><div class="value">${data.activations_today}</div></div>
            <div class="stat green"><div class="label">ОНЛАЙН 5М</div><div class="value">${data.online_5min}</div></div>
        `;
      });
  }

  function exportCsv() { window.location.href = SERVER + '/admin/export?' + authQS(); }

  const savedLogin = sessionStorage.getItem('z_login');
  const savedPwd = sessionStorage.getItem('z_pwd');
  if (savedLogin && savedPwd) { login = savedLogin; pwd = savedPwd; showPanel(); }
</script>
</body>
</html>
