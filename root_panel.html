<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeus-X · ROOT ACCESS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  
  :root {
    --bg: #07060b; --panel: #120f1a; --accent: #8c5aff; --accent-glow: rgba(140, 90, 255, 0.4);
    --green: #00e676; --red: #ff2a2a; --text: #ebe1fa; --muted: #8e8e99; --border: rgba(140, 90, 255, 0.3);
  }

  body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
  body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(140, 90, 255, 0.1), transparent 50%); z-index: -1; }

  .container { max-width: 1000px; margin: 0 auto; }
  
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 15px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-bottom: 20px; animation: slideUp 0.5s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  h1 { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 15px; }
  p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  
  input { width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 15px; margin-bottom: 15px; outline: none; transition: 0.3s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
  
  .btn { padding: 14px 24px; background: linear-gradient(135deg, #6b3fc2, #8c5aff); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(140, 90, 255, 0.2); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--accent-glow); }
  .btn.green { background: linear-gradient(135deg, #1a6b40, #00e676); color: black; }
  
  .result { display: none; margin-top: 15px; padding: 15px; background: rgba(0, 230, 118, 0.1); border: 1px solid var(--green); border-radius: 10px; }
  .result code { font-family: 'JetBrains Mono', monospace; font-size: 16px; color: white; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; }
  
  .table-wrap { overflow-x: auto; margin-top: 20px; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
  th { background: rgba(0,0,0,0.3); color: var(--accent); padding: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
  td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
  tr:hover { background: rgba(140, 90, 255, 0.05); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  
  .error { color: var(--red); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">

  <!-- ЭКРАН ВХОДА -->
  <div class="box" id="authBox">
    <h1>ROOT ACCESS</h1>
    <p>Введите главный пароль администратора (из Render).</p>
    <input type="text" id="loginInput" placeholder="Логин главного админа" value="admin">
    <input type="password" id="pwdInput" placeholder="Главный пароль">
    <button class="btn" style="width:100%;" onclick="doLogin()">ПОДТВЕРДИТЬ</button>
    <p class="error" id="errorMsg"></p>
  </div>

  <!-- ЭКРАН УПРАВЛЕНИЯ -->
  <div class="box" id="genBox" style="display:none;">
    <h1>МОНИТОРИНГ И ГЕНЕРАЦИЯ</h1>
    <p>Создайте временный доступ или посмотрите, кто уже заходил.</p>
    
    <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
      <input type="number" id="minutesInput" placeholder="Минут" value="30" style="margin:0; flex:1;">
      <button class="btn green" onclick="createTemp()">СГЕНЕРИРОВАТЬ</button>
    </div>
    
    <div class="result" id="resultBox">
      <p style="color:var(--green); margin:0 0 10px 0;">Доступ успешно создан!</p>
      <div>Логин: <code id="resLogin"></code></div>
      <div style="margin-top:5px;">Пароль: <code id="resPwd"></code></div>
    </div>

    <h3 style="font-size:16px; margin:30px 0 10px 0; color:var(--text);">Мониторинг доступа</h3>
    <button class="btn" style="background:#333; padding:8px 16px; font-size:12px; margin-bottom:10px;" onclick="loadList()">🔄 Обновить список</button>
    
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Логин</th>
            <th>Статус</th>
            <th>IP</th>
            <th>Устройство (ОС)</th>
            <th>Последний вход</th>
          </tr>
        </thead>
        <tbody id="tempBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const SERVER = 'https://zeus-key-mjep.onrender.com';
  let rootAuth = '';

  // Вход
  async function doLogin() {
    const l = document.getElementById('loginInput').value.trim();
    const p = document.getElementById('pwdInput').value;
    rootAuth = 'login=' + encodeURIComponent(l) + '&pwd=' + encodeURIComponent(p);
    
    try {
      const res = await fetch(SERVER + '/admin/login?' + rootAuth);
      const data = await res.json();
      if (data.ok) {
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('genBox').style.display = 'block';
        loadList();
      } else {
        document.getElementById('errorMsg').textContent = 'Неверный пароль';
      }
    } catch (e) {
      document.getElementById('errorMsg').textContent = 'Сервер недоступен';
    }
  }

  // Создание временного админа
  async function createTemp() {
    const min = document.getElementById('minutesInput').value;
    const res = await fetch(`${SERVER}/root/create_temp?minutes=${min}&${rootAuth}`);
    const data = await res.json();
    
    if (data.ok) {
      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('resLogin').textContent = data.login;
      document.getElementById('resPwd').textContent = data.pwd;
      loadList();
    } else {
      alert('Ошибка: ' + (data.reason === 'access_denied' ? 'Нет прав' : data.reason));
    }
  }

  // Загрузка списка
  async function loadList() {
    const res = await fetch(`${SERVER}/root/temp_list?${rootAuth}`);
    const data = await res.json();
    if (!data.ok) return;
    
    document.getElementById('tempBody').innerHTML = data.admins.map(a => {
      const isExpired = (Date.now() / 1000) > a.expires_at;
      const status = isExpired ? '<span style="color:var(--red);">Истек</span>' : '<span style="color:var(--green);">Активен</span>';
      const lastLog = a.last_login > 0 ? new Date(a.last_login * 1000).toLocaleString('ru-RU') : '—';
      
      return `
        <tr>
          <td class="mono">${a.login}</td>
          <td>${status}</td>
          <td class="mono">${a.last_ip}</td>
          <td style="font-size:11px; color:var(--muted); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${a.last_agent}</td>
          <td>${lastLog}</td>
        </tr>
      `;
    }).join('');
  }
</script>
</body>
</html>
